name: Sync Project Tables
'on':
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch: null
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/update-readme-projects.ts
      - .github/workflows/update-projects.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Regenerate project tables
        env:
          GH_TOKEN: ${{ secrets.PROFILE_README_TOKEN }}
        run: node scripts/update-readme-projects.ts
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (
            git add README.md &&
            git commit -m "chore: sync project tables [skip ci]" &&
            git push
          )
    timeout-minutes: 5
