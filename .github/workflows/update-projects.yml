name: Sync Project Tables

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/update-readme-projects.ts
      - .github/workflows/update-projects.yml

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The gh CLI reads GH_TOKEN; our code never does. It has to be the PAT, because
      # the default github.token cannot see /user/repos, so private repos would go missing.
      - name: Regenerate project tables
        env:
          GH_TOKEN: ${{ secrets.PROFILE_README_TOKEN }}
        run: node scripts/update-readme-projects.ts

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (
            git add README.md &&
            git commit -m "chore: sync project tables [skip ci]" &&
            git push
          )
